[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; lib_deps reference GitHub directly (git clone over https), not PlatformIO's own
; package registry - api.platformio.org/dl.platformio.org/registry.platformio.org
; are network-blocked in the environment this was developed in (see CLAUDE.md);
; github.com's git protocol was confirmed reachable there. If your own network can
; reach the PlatformIO registry fine, a normal "PubSubClient" entry works too - this
; pinned-URL form is just the one confirmed to work under that constraint.
lib_deps =
    https://github.com/knolleary/pubsubclient.git
    https://github.com/esphome-libs/wireguard.git#v0.4.6
; wireguard was formerly published as droscy/esp_wireguard (same repo, renamed -
; see that library's own README); its library.json declares real PlatformIO
; support for framework = arduino directly (build.includeDir/srcDir - PlatformIO's
; own library builder, not the ESP-IDF idf_component_register() path in its
; CMakeLists.txt, which only runs under ESP-IDF's own build system). No manual
; components/ vendoring or framework = arduino, espidf combo build needed - a
; plain lib_deps entry is the real, confirmed integration shape.
; wireguard's own library.json declares a PlatformIO-registry dependency on
; esphome/libsodium - pinned here the same way, to the matching real GitHub repo,
; since (per the comment above) this environment can't reach the PlatformIO
; registry to let LDF resolve that nested dependency automatically.
; Real module is ESP32-S3-WROOM-1U-N16R8: 16MB Quad SPI flash, 8MB octal-mode PSRAM.
; "esp32-s3-devkitc-1" is a generic N8 board profile - override flash size and memory
; mode so the build actually matches the real hardware.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; That board profile's default partition table (default_8MB.csv, confirmed by fetching
; it directly from arduino-esp32) is sized for the profile's 8MB, not this module's real
; 16MB - leaving half the flash unaddressed if not overridden. partitions_16mb_ota.csv
; (same directory as this file) is the same ota_0/ota_1/otadata/nvs/spiffs/coredump
; layout, resized for 16MB with real OTA-slot headroom - see that file's own header for
; the sizing/alignment reasoning. Needed by firmware/lib/ota_update (F3's OTA-with-
; rollback item).
board_build.partitions = partitions_16mb_ota.csv
build_flags =
    -I$PROJECT_INCLUDE_DIR
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
; LTE backhaul (firmware/lib/lte_ppp) uses arduino-esp32's built-in PPP
; library (PPP.h), which wraps ESP-IDF's esp_modem component and is
; gated behind ESP-IDF's own CONFIG_LWIP_PPP_SUPPORT Kconfig option -
; confirmed via arduino-esp32's own PPP.h source (#if CONFIG_LWIP_PPP_
; SUPPORT && ARDUINO_HAS_ESP_MODEM). Multiple arduino-esp32 GitHub
; issues (#7483, #7203) confirm this option was OFF by default at
; various points in the 2.x core's history; this project's pioarduino/
; framework=arduino build uses a precompiled core, and unlike the OTA-
; signing Kconfig question (ota_signing_key.h's header comment - ruled
; out there because a silent failure would be a security hole), this
; one's failure mode if the assumption is wrong is a LOUD compile error
; (PPP symbols undefined/excluded), not a silent one - an acceptable
; risk to proceed past with this documented mitigation rather than
; block on it. custom_sdkconfig itself is a real, working pioarduino
; override mechanism - confirmed against pioarduino's own issue #335
; (CONFIG_BT_ENABLED=n example) - not assumed.
custom_sdkconfig =
    CONFIG_LWIP_PPP_SUPPORT=y

[env:native]
; Host-native build for hardware-independent logic (protocol framing, payload
; construction, mapping tables). No ESP32 toolchain needed - runs on this machine's
; own gcc. This is where real `pio test` execution happens, separate from the
; esp32-s3-devkitc-1 env above, which only build-verifies against the real target.
platform = native
; native builds don't have arduino-esp32/ESP-IDF available at all, but several
; lib/ files transitively reference their headers just to declare types/params
; (HardwareSerial, Preferences, LittleFS, Update, esp_ota_ops, esp_system) -
; test/native_stubs/ supplies minimal native-safe fakes for exactly those, kept
; in ONE shared location (not per-test copies) specifically so two
; non-identical definitions of the same class/struct never end up linked into
; the same test binary (see that directory's own file-level comments for the
; reasoning per header). lib_extra_dirs makes it visible to every native
; compilation unit - both test/*.cpp and the real lib/*.cpp sources LDF pulls
; in - not just the test program's own private include path, which is what a
; per-test stub directory alone does NOT cover.
;
; system_watchdog is lib_ignore'd (not just given a fake header) because a
; real, working fake IMPLEMENTATION for it already exists
; (test/native_stubs/fake_system_watchdog.cpp, trivial no-op bodies - see its
; own header comment) - ignoring the real esp_task_wdt-based one avoids ever
; linking both into the same binary.
lib_ignore = system_watchdog
lib_extra_dirs = test/native_stubs
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
