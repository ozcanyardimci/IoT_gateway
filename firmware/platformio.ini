[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Real module is ESP32-S3-WROOM-1U-N16R8: 16MB Quad SPI flash, 8MB octal-mode PSRAM.
; "esp32-s3-devkitc-1" is a generic N8 board profile - override flash size and memory
; mode so the build actually matches the real hardware.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
